[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku-island"
version = "1.0.0"
description = "Exact search for connected binary Sudoku patterns, with an even-digit completion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sudoku-island = "sudoku_island:main"

[tool.setuptools]
py-modules = ["sudoku_island", "sudoku_completion"]

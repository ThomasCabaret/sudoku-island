<path d="M 48 368 H 624 M 304 112 V 688" stroke="#333" stroke-width="1"/>
<path d="M 48 432 H 624 M 368 112 V 688" stroke="#333" stroke-width="1"/>
<path d="M 48 496 H 624 M 432 112 V 688" stroke="#333" stroke-width="3"/>
<path d="M 48 560 H 624 M 496 112 V 688" stroke="#333" stroke-width="1"/>
<path d="M 48 624 H 624 M 560 112 V 688" stroke="#333" stroke-width="1"/>
<path d="M 48 688 H 624 M 624 112 V 688" stroke="#333" stroke-width="3"/>
<rect class="parity-even" x="62" y="126" width="36" height="36" fill="#e9f4fb" stroke="#276b94" stroke-width="2.5"/>
<circle class="parity-odd" cx="592" cy="592" r="18" fill="#e9f4fb" stroke="#276b94" stroke-width="2.5"/>
<polyline points="464,592 400,528 400,592 336,656 272,592" fill="none" stroke="#c4ccd4" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="464" cy="592" r="18" fill="#c4ccd4"/>
<polyline points="464,208 528,272 592,336 592,272" fill="none" stroke="#c4ccd4" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="464" cy="208" r="18" fill="#c4ccd4"/>
<polyline points="528,464 528,528 592,464 592,528" fill="none" stroke="#c4ccd4" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="528" cy="464" r="18" fill="#c4ccd4"/>
<polyline points="144,336 144,272 208,272 144,208 208,144" fill="none" stroke="#c4ccd4" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="144" cy="336" r="18" fill="#c4ccd4"/>
<text x="704" y="228" font-family="Helvetica" font-size="14" fill="#536170">RULES</text>
<text x="704" y="263" font-family="Helvetica" font-size="17" fill="#172433">1.</text>
<text x="730" y="263" font-family="Helvetica" font-size="17" fill="#172433">Place the digits 1-9 once in each row, each</text>
<text x="730" y="286" font-family="Helvetica" font-size="17" fill="#172433">column and each 3x3 box.</text>
<text x="704" y="323" font-family="Helvetica" font-size="17" fill="#172433">2.</text>
<text x="730" y="323" font-family="Helvetica" font-size="17" fill="#172433">All cells containing an even digit (2, 4, 6 or 8)</text>
<text x="730" y="346" font-family="Helvetica" font-size="17" fill="#172433">must be orthogonally connected. In other words,</text>
<text x="730" y="369" font-family="Helvetica" font-size="17" fill="#172433">the even digits form a single connected island.</text>
<text x="730" y="392" font-family="Helvetica" font-size="17" fill="#172433">Only side-to-side contact counts; diagonal</text>
<text x="730" y="415" font-family="Helvetica" font-size="17" fill="#172433">contact does not.</text>
<text x="704" y="452" font-family="Helvetica" font-size="17" fill="#172433">3.</text>
<text x="730" y="452" font-family="Helvetica" font-size="17" fill="#172433">A blue square contains an even digit. A blue</text>
<text x="730" y="475" font-family="Helvetica" font-size="17" fill="#172433">circle contains an odd digit.</text>
<text x="704" y="512" font-family="Helvetica" font-size="17" fill="#172433">4.</text>
<text x="730" y="512" font-family="Helvetica" font-size="17" fill="#172433">Digits strictly increase along each grey</text>
<text x="730" y="535" font-family="Helvetica" font-size="17" fill="#172433">thermometer, from its bulb to its tip.</text>
<text x="704" y="704" font-family="Helvetica" font-size="14" fill="#536170">Line segments may connect cells diagonally.</text>
<path d="M 48 752 H 1232" stroke="#dce3e9" stroke-width="1"/>
<text x="48" y="776" font-family="Helvetica" font-size="12" fill="#536170">Thomas Cabaret | 25 November 2026</text>
<text x="704" y="776" font-family="Helvetica" font-size="12" fill="#536170">Procedurally generated. Guaranteed unique solution.</text>
</svg>

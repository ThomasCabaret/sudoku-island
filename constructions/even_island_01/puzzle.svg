<text x="72" y="704" font-family="sans-serif" font-size="15" fill="#172433">Place 1-9 once in every row, column and 3x3 box.</text>
<text x="72" y="728" font-family="sans-serif" font-size="15" fill="#172433">All cells containing 2, 4, 6 or 8 form one side-connected island.</text>
<text x="72" y="752" font-family="sans-serif" font-size="15" fill="#172433">Digits strictly increase from each thermometer bulb to its tip.</text>
<text x="72" y="810" font-family="sans-serif" font-size="13" fill="#536170">Thermometer segments may run diagonally.</text>
<text x="72" y="834" font-family="sans-serif" font-size="13" fill="#536170">No given digits. Diagonal contact never joins even cells.</text>

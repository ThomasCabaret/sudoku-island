<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
<title>Two Even Anchors</title>
<rect width="1280" height="800" fill="white"/>
<path d="M 664 96 V 736" stroke="#dce3e9" stroke-width="1"/>
<text x="704" y="108" font-family="Helvetica" font-size="13" fill="#536170">SUDOKU / EVEN ISLAND</text>
<text x="704" y="151" font-family="Helvetica" font-size="32" fill="#172433">Two Even Anchors</text>
<text x="704" y="184" font-family="Helvetica" font-size="13" fill="#536170">PUZZLE / NO GIVEN DIGITS</text>
<path d="M 48 112 H 624 M 48 112 V 688" stroke="#333" stroke-width="3"/>
<path d="M 48 176 H 624 M 112 112 V 688" stroke="#333" stroke-width="1"/>
<path d="M 48 240 H 624 M 176 112 V 688" stroke="#333" stroke-width="1"/>
<path d="M 48 304 H 624 M 240 112 V 688" stroke="#333" stroke-width="3"/>
<path d="M 48 368 H 624 M 304 112 V 688" stroke="#333" stroke-width="1"/>
<path d="M 48 432 H 624 M 368 112 V 688" stroke="#333" stroke-width="1"/>
<path d="M 48 496 H 624 M 432 112 V 688" stroke="#333" stroke-width="3"/>
<path d="M 48 560 H 624 M 496 112 V 688" stroke="#333" stroke-width="1"/>
<path d="M 48 624 H 624 M 560 112 V 688" stroke="#333" stroke-width="1"/>
<path d="M 48 688 H 624 M 624 112 V 688" stroke="#333" stroke-width="3"/>
<rect class="parity-even" x="254" y="126" width="36" height="36" fill="#e9f4fb" stroke="#276b94" stroke-width="2.5"/>
<rect class="parity-even" x="574" y="638" width="36" height="36" fill="#e9f4fb" stroke="#276b94" stroke-width="2.5"/>
<polyline points="400,656 464,656 528,592 592,528" fill="none" stroke="#c4ccd4" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="400" cy="656" r="18" fill="#c4ccd4"/>
<polyline points="400,272 464,208 528,272 592,336" fill="none" stroke="#c4ccd4" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="400" cy="272" r="18" fill="#c4ccd4"/>
<polyline points="464,592 400,528 336,464 336,528" fill="none" stroke="#c4ccd4" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="464" cy="592" r="18" fill="#c4ccd4"/>
<polyline points="208,336 208,272 144,208 208,144" fill="none" stroke="#c4ccd4" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="208" cy="336" r="18" fill="#c4ccd4"/>
<text x="704" y="228" font-family="Helvetica" font-size="14" fill="#536170">RULES</text>
<text x="704" y="263" font-family="Helvetica" font-size="17" fill="#172433">1.</text>
<text x="730" y="263" font-family="Helvetica" font-size="17" fill="#172433">Place the digits 1-9 once in each row, each</text>
<text x="730" y="286" font-family="Helvetica" font-size="17" fill="#172433">column and each 3x3 box.</text>
<text x="704" y="323" font-family="Helvetica" font-size="17" fill="#172433">2.</text>
<text x="730" y="323" font-family="Helvetica" font-size="17" fill="#172433">All cells containing an even digit (2, 4, 6 or 8)</text>
<text x="730" y="346" font-family="Helvetica" font-size="17" fill="#172433">must be orthogonally connected.</text>
<text x="704" y="383" font-family="Helvetica" font-size="17" fill="#172433">3.</text>
<text x="730" y="383" font-family="Helvetica" font-size="17" fill="#172433">Blue squares contain even digits.</text>
<text x="704" y="420" font-family="Helvetica" font-size="17" fill="#172433">4.</text>
<text x="730" y="420" font-family="Helvetica" font-size="17" fill="#172433">Digits strictly increase along each grey</text>
<text x="730" y="443" font-family="Helvetica" font-size="17" fill="#172433">thermometer, from its bulb to its tip.</text>
<text x="704" y="704" font-family="Helvetica" font-size="14" fill="#536170">Line segments may connect cells diagonally.</text>
<text x="704" y="726" font-family="Helvetica" font-size="14" fill="#536170">Even cells connect through sides, never diagonally.</text>
</svg>

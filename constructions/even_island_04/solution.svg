<text x="704" y="228" font-family="Helvetica" font-size="14" fill="#536170">RULES</text>
<text x="704" y="263" font-family="Helvetica" font-size="17" fill="#172433">1.</text>
<text x="730" y="263" font-family="Helvetica" font-size="17" fill="#172433">Place the digits 1-9 once in each row, each</text>
<text x="730" y="286" font-family="Helvetica" font-size="17" fill="#172433">column and each 3x3 box.</text>
<text x="704" y="323" font-family="Helvetica" font-size="17" fill="#172433">2.</text>
<text x="730" y="323" font-family="Helvetica" font-size="17" fill="#172433">All cells containing an even digit (2, 4, 6 or 8)</text>
<text x="730" y="346" font-family="Helvetica" font-size="17" fill="#172433">must be orthogonally connected. In other words,</text>
<text x="730" y="369" font-family="Helvetica" font-size="17" fill="#172433">the even digits form a single connected island.</text>
<text x="730" y="392" font-family="Helvetica" font-size="17" fill="#172433">Only side-to-side contact counts; diagonal</text>
<text x="730" y="415" font-family="Helvetica" font-size="17" fill="#172433">contact does not.</text>
<text x="704" y="452" font-family="Helvetica" font-size="17" fill="#172433">3.</text>
<text x="730" y="452" font-family="Helvetica" font-size="17" fill="#172433">Blue squares contain even digits.</text>
<text x="704" y="489" font-family="Helvetica" font-size="17" fill="#172433">4.</text>
<text x="730" y="489" font-family="Helvetica" font-size="17" fill="#172433">Digits strictly increase along each grey</text>
<text x="730" y="512" font-family="Helvetica" font-size="17" fill="#172433">thermometer, from its bulb to its tip.</text>
<text x="704" y="704" font-family="Helvetica" font-size="14" fill="#536170">Line segments may connect cells diagonally.</text>
<text x="704" y="726" font-family="Helvetica" font-size="14" fill="#536170">Shaded cells contain even digits.</text>

name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m constructions.build --check
      - run: python -m constructions.parity --json parity-analysis.json
      - run: sudoku-island-puzzles verify constructions/even_island_01/puzzle.json --audit --json puzzle-audit.json
      - name: Check the zero-given puzzle
        run: >-
          python -c "import json; r=json.load(open('puzzle-audit.json'));
          assert r['full']['status'] == 'UNIQUE';
          assert r['without_island_rule']['status'] == 'MULTIPLE';
          assert all(x['result']['status'] == 'MULTIPLE' for x in r['without_each_line'])"
      - run: sudoku-island --minimum --check-uniqueness --sudoku --json results.json
      - name: Check the computed conclusions
        run: >-
          python -c "import json; r=json.load(open('results.json'));
          assert r['minimum'] == 4;
          assert r['uniqueness']['status'] == 'UNIQUE';
          assert r['uniqueness']['orbit_size'] == 8;
          assert r['sudoku_completion']['status'] == 'SAT'"

name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: sudoku-island --minimum --check-uniqueness --sudoku --json results.json
      - name: Check the computed conclusions
        run: >-
          python -c "import json; r=json.load(open('results.json'));
          assert r['minimum'] == 4;
          assert r['uniqueness']['status'] == 'UNIQUE';
          assert r['uniqueness']['orbit_size'] == 8;
          assert r['sudoku_completion']['status'] == 'SAT'"
